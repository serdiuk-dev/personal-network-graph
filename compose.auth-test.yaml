# Only use with an isolated project name and --env-file /dev/null.
# No production files, published ports, external networks or persistent volumes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pnet_auth_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: pnet_auth_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pnet_auth_test -d pnet_auth_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]
  test:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://pnet_auth_test:isolated-test-only@db:5432/pnet_auth_test?schema=public
      PNET_AUTH_TEST: isolated
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-ec', 'npx --no-install prisma migrate deploy --schema=prisma/schema.prisma && node --test --test-concurrency=1 test/*.test.cjs']
    networks: [test]
  web-test:
    build:
      context: apps/web
      dockerfile: Dockerfile
      target: build
    command: ['sh', '-ec', './node_modules/.bin/tsc --module commonjs --target es2022 --skipLibCheck --lib es2022,dom --outDir /tmp/pnet-auth-client src/auth/client.ts && node --test test/auth-client.test.cjs']
    networks: [test]
networks:
  test:
    internal: true
