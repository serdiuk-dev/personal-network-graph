name: pnet

services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


  api:
    profiles:
      - app

    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NOTIFICATION_TELEGRAM_CHAT_ID: ${NOTIFICATION_TELEGRAM_CHAT_ID:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health',{signal:AbortSignal.timeout(3000)}).then(async r=>{if(r.status!==200)process.exit(1);const b=await r.json();process.exit(b.status==='ok'&&b.service==='pnet-api'?0:1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 6s
      start_period: 30s
      retries: 3

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend


  web:
    profiles:
      - app

    build:
      context: ./apps/web

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null http://127.0.0.1/ &&
          wget -q -T 3 -O - http://127.0.0.1/api/v1/health |
          grep -Eq '"service"[[:space:]]*:[[:space:]]*"pnet-api"'
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 3

    ports:
      - "127.0.0.1:8091:80"

    depends_on:
      - api

    networks:
      - backend


networks:
  backend:


volumes:
  db_data:
